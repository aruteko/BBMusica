name: Android Preview APK

# 自分用ビルド: EXPO_TOKEN や署名鍵などのシークレットは不要。
# 手動実行（Actions タブ → Android Preview APK → Run workflow）で arm64-v8a の APK を作る。
# 署名は Expo prebuild の既定（デバッグ鍵）。パッケージ名は com.roitium.bbplayer.preview なので、
# 公式版と同時にインストールできる。

on:
  # このブランチに push すると自動でビルドが始まる（手動実行も可）
  push:
    branches:
      - feature/station-home-collage-cover
  workflow_dispatch:
    inputs:
      variant:
        description: 'APP_VARIANT (preview = 公式版と共存 / production = 公式と同じパッケージ名)'
        type: choice
        default: jp
        options:
          - jp
          - preview
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: ${{ inputs.variant || 'jp' }}
      ABI_FILTERS: arm64-v8a
      CI: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm (version from packageManager)
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Expo prebuild (generate android/)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bbplayer-${{ inputs.variant || 'jp' }}-arm64-v8a
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
